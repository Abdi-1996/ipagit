name: Build Video to Live IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'VideoToLivePhoto/**'
      - '.github/workflows/build-video-to-live.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: VideoToLivePhoto
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: VideoToLivePhoto
        run: |
          set -o pipefail
          xcodebuild \
            -project VideoToLivePhoto.xcodeproj \
            -scheme VideoToLivePhoto \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log

      - name: Package IPA
        working-directory: VideoToLivePhoto
        run: |
          APP="build/Build/Products/Release-iphoneos/VideoToLivePhoto.app"
          test -d "$APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry VideoToLivePhoto-unsigned.ipa Payload
          ls -lh VideoToLivePhoto-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VideoToLivePhoto-IPA
          path: |
            VideoToLivePhoto/VideoToLivePhoto-unsigned.ipa
            VideoToLivePhoto/xcodebuild.log
          retention-days: 30
          if-no-files-found: error
